</head>
<body>
<div id="conectar" style="display:none">
  <div class="conectar-caixa">
    <div class="avatar grande-av"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.8 4.9 4.9 1.8-4.9 1.8L11 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18.5 14.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z"/></svg></div>
    <h1>Jarvis Finance</h1>
    <p>Para ver seus dados aqui, abra o Jarvis no computador, vá em <b>Ajustes → Celular</b> e aponte a câmera do iPhone para o QR code.</p>
    <details><summary>Prefiro colar o link</summary>
      <textarea id="colar-link" rows="3" placeholder="Cole aqui o link do Jarvis" autocapitalize="none" spellcheck="false"></textarea>
      <button class="btn pri largo" id="colar-ok">Conectar</button><small id="colar-msg"></small>
    </details>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="lateral">
    <div class="marca"><span class="avatar">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.8 4.9 4.9 1.8-4.9 1.8L11 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18.5 14.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z"/></svg></span><b>Jarvis Finance</b></div>
    <nav class="nav-lateral">
      <button data-tela="hoje"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>Hoje</button>
      <button data-tela="habitos"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a6 6 0 0 0 6-6c0-3.4-2.3-5.4-3.5-8.1-.4 1.8-1.2 3-2.5 3.6.3-2.9-.6-5.3-2.7-7.5.2 3.4-1.9 5.4-3.3 7.5A7.3 7.3 0 0 0 6 15a6 6 0 0 0 6 6z"/><path d="M12 21a2.5 2.5 0 0 1-2.5-2.5c0-1.5 1.3-2.4 2.5-3.9 1.2 1.5 2.5 2.4 2.5 3.9A2.5 2.5 0 0 1 12 21z"/></svg>Hábitos e saúde</button>
      <button data-tela="finn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.8 4.9 4.9 1.8-4.9 1.8L11 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18.5 14.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z"/></svg>Falar com o Jarvis</button>
      <div class="nav-secao">Finanças</div>
      <button data-tela="inicio"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg>Resumo</button>
      <button data-tela="mov"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.1"/><circle cx="4.6" cy="12" r="1.1"/><circle cx="4.6" cy="17.5" r="1.1"/></svg>Movimentações</button>
      <button data-tela="contas"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-2.2-1.4-2 1.4-1.8-1.4-1.8 1.4-2-1.4L6 20.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></svg>Contas fixas</button>
      <button data-tela="planos"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.2"/></svg>Planos e metas</button>
      <button data-tela="mercado"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h2.6l2.3 11h11l2-7.5H6.2"/><circle cx="9" cy="19.3" r="1.4"/><circle cx="17" cy="19.3" r="1.4"/></svg>Mercado</button>
      <div class="nav-secao">Memória</div>
      <button data-tela="cerebro"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 4.2A3 3 0 0 0 6.3 7a3.2 3.2 0 0 0-2 5.3 3.2 3.2 0 0 0 1.8 5 3 3 0 0 0 3.2 2.5A2.6 2.6 0 0 0 12 18V6.5a2.6 2.6 0 0 0-2.8-2.3z"/><path d="M14.8 4.2A3 3 0 0 1 17.7 7a3.2 3.2 0 0 1 2 5.3 3.2 3.2 0 0 1-1.8 5 3 3 0 0 1-3.2 2.5A2.6 2.6 0 0 1 12 18"/><path d="M8.5 10.5c1 0 1.8.6 2.2 1.4M15.5 13.5c-1 0-1.8-.6-2.2-1.4"/></svg>Segundo cérebro</button>
      <button data-tela="biblioteca"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a1.5 1.5 0 0 1 1.5-1.5H20v14H5.5A1.5 1.5 0 0 0 4 19.5zM4 19.5A1.5 1.5 0 0 0 5.5 21H20"/></svg>Biblioteca</button>
      <div class="nav-sep"></div>
      <button data-tela="ajustes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5v-6M4 10V3.5M12 20.5V12M12 8V3.5M20 20.5v-4M20 12.5v-9M1.5 14h5M9.5 8.5h5M17.5 16.5h5"/></svg>Ajustes</button>
    </nav>
    <div id="nuvem" class="nuvem"><i></i><span></span></div>
  </aside>
  <main id="principal">
    <header id="topo"><h1 id="titulo">Hoje</h1><button id="topo-ajustes" class="redondo" data-tela="ajustes" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5v-6M4 10V3.5M12 20.5V12M12 8V3.5M20 20.5v-4M20 12.5v-9M1.5 14h5M9.5 8.5h5M17.5 16.5h5"/></svg></button></header>
    <div id="subnav"></div>
    <div id="tela"></div>
  </main>
  <nav id="abas">
    <button data-tela="hoje"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span>Hoje</span></button>
    <button data-tela="financas"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 8V6a1.5 1.5 0 0 0-1.5-1.5H5.5A2 2 0 0 0 3.5 6.5v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5.5a2 2 0 0 1-2-1.5"/><circle cx="16.5" cy="13.5" r="1.1"/></svg><span>Finanças</span></button>
    <button data-tela="finn" class="aba-finn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.8 4.9 4.9 1.8-4.9 1.8L11 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18.5 14.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z"/></svg><span>Jarvis</span></button>
    <button data-tela="mercado"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h2.6l2.3 11h11l2-7.5H6.2"/><circle cx="9" cy="19.3" r="1.4"/><circle cx="17" cy="19.3" r="1.4"/></svg><span>Mercado</span></button>
    <button data-tela="memoria"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 4.2A3 3 0 0 0 6.3 7a3.2 3.2 0 0 0-2 5.3 3.2 3.2 0 0 0 1.8 5 3 3 0 0 0 3.2 2.5A2.6 2.6 0 0 0 12 18V6.5a2.6 2.6 0 0 0-2.8-2.3z"/><path d="M14.8 4.2A3 3 0 0 1 17.7 7a3.2 3.2 0 0 1 2 5.3 3.2 3.2 0 0 1-1.8 5 3 3 0 0 1-3.2 2.5A2.6 2.6 0 0 1 12 18"/><path d="M8.5 10.5c1 0 1.8.6 2.2 1.4M15.5 13.5c-1 0-1.8-.6-2.2-1.4"/></svg><span>Memória</span></button>
  </nav>
</div>
